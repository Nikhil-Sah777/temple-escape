<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temple Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d08;--stone:#2a2018;--line:#5a4426;--sand:#f1e3c4;--dim:#c9b793;--gold:#e0b252;--lapis:#4fb3c2;--acc:var(--gold)}
body[data-wing="runes"]{--acc:var(--lapis)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:18px;color:var(--sand);font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 0,#3b2a17,var(--bg) 70%)}
#app{width:100%;max-width:560px}
.hidden{display:none}
h1,h2,.wing b,.btn{font-family:'Cinzel',Georgia,serif}
h1{text-align:center;color:var(--gold);font-size:2.3rem;letter-spacing:.12em;margin:14px 0 4px;text-shadow:0 0 18px #e0b25266}
.tag{text-align:center;color:var(--dim);margin:0 0 20px}
.wing{display:block;width:100%;margin:12px 0;padding:16px 18px;background:var(--stone);border:2px solid var(--line);border-radius:10px;color:var(--sand);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s}
.wing:hover{transform:translateY(-2px)}
.wing b{display:block;font-size:1.15rem;margin-bottom:4px}
.wing span{display:block;color:var(--dim);font-size:.95rem;line-height:1.4}
.wing small{display:block;margin-top:8px;color:var(--dim)}
#w-riddles:hover{border-color:var(--gold)}#w-riddles b{color:var(--gold)}
#w-runes:hover{border-color:var(--lapis)}#w-runes b{color:var(--lapis)}
.bar{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:6px}
#time{font-variant-numeric:tabular-nums}
#time.low{color:#ff6b5a;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.25)}}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:26px 0 18px}
.torch{width:14px;height:80px;background:#4a3820;border-radius:3px;position:relative}
.flame{position:absolute;left:-4px;top:-28px;width:22px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff3b0,#ffa522 60%,#d94a0f);box-shadow:0 0 22px #ff9a2e;animation:flick .25s infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.door{position:relative;display:flex;width:170px;height:200px;overflow:hidden;border:6px solid var(--line);border-radius:85px 85px 0 0;background:radial-gradient(#ffe08a,#7a5410)}
.panel{width:50%;background:repeating-linear-gradient(0deg,#3b2f22 0 18px,#31261b 18px 20px);transition:transform 1.1s ease-in-out}
.panel:first-child{border-right:2px solid #1a120a}
.door.open .panel:first-child{transform:translateX(-100%)}
.door.open .panel:last-child{transform:translateX(100%)}
.door::after{content:"\25C8";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:var(--acc);text-shadow:0 0 14px var(--acc);transition:opacity .5s}
.door.open::after{opacity:0}
.card{background:#1d150d;border:2px solid #4a3820;border-radius:10px;padding:16px}
#q{margin:0 0 12px;line-height:1.55;font-size:1.05rem}
pre{margin:0 0 12px;padding:12px;border-radius:8px;overflow-x:auto;background:#0c0805;color:#a8e6ee;font:14px/1.5 Consolas,Menlo,monospace}
input{width:100%;margin-bottom:10px;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--sand);font:16px Consolas,Menlo,monospace}
input:focus,.btn:focus-visible,.wing:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--acc);background:var(--acc);color:#1b1206;font-size:1rem;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc)}
.btn:hover{filter:brightness(1.15)}
#msg{min-height:1.5em;margin:12px 0 0;color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.flash{animation:flash .5s}
@keyframes flash{30%{border-color:#ff4a3a;box-shadow:0 0 24px #ff4a3a}}
.end{text-align:center}
.stars{font-size:2.4rem;color:var(--gold);letter-spacing:8px;margin:10px 0}
.end p{color:var(--dim);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.panel{transition-duration:.01s}}

.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.grp.hidden{display:none}
.grp>span{width:100%;color:var(--dim)}
.chip{padding:9px 14px;border-radius:20px;border:2px solid var(--line);background:var(--stone);color:var(--sand);font:inherit;cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:var(--acc)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#best{color:var(--dim);margin:6px 0 16px}
.go{width:100%}

input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
.sl{display:flex;align-items:center;gap:10px;width:100%}
.sl.hidden{display:none}
.sl input{flex:1;margin:0}
.sl output{min-width:7.5em;color:var(--dim)}
.bar2{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--gold)}
.row{flex-wrap:wrap}
.row .btn{font-size:.9rem;padding:12px 8px;min-width:96px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.screen{animation:fin .5s ease}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
#embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff9a2e;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.8}100%{transform:translate(var(--dx),-105vh);opacity:0}}
#app{position:relative;z-index:1}
.door.open{box-shadow:0 0 40px #ffe08a99;animation:glow 1.1s}
@keyframes glow{50%{box-shadow:0 0 70px #ffe08a}}
#score.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.3)}}
#mute{position:fixed;top:12px;right:12px;z-index:5;padding:6px 12px;border-radius:20px;border:2px solid var(--line);background:var(--stone);color:var(--sand);font:inherit;cursor:pointer}
.rank{font-family:'Cinzel',Georgia,serif;color:var(--acc);font-size:1.4rem;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--stone);border:2px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--dim)}
.stats b{display:block;font-size:1.4rem;color:var(--gold)}
.spark{position:fixed;top:-14px;width:8px;height:12px;pointer-events:none;z-index:9;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:0}}
.tbar{height:8px;border-radius:6px;background:#0c0805;border:1px solid var(--line);overflow:hidden;margin-bottom:6px}
#tfill{height:100%;width:100%;background:var(--acc);transition:width 1s linear,background .3s}
#tfill.low{background:#ff6b5a}
.tbar.off{visibility:hidden}
</style>

  </div>
</section>

</main>

const EXTRA = {

let snd = true, AC, shareText = "";
function tone(f, d, t = "sine", at = 0, v = 0.08) {
  if (!snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + at;
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d);
  } catch (e) {}
}

  ["wing", "Wing", [["riddles", "Riddles"], ["runes", "Runes (code)"]]],
  ["lang", "Language", [["python", "Python"], ["c", "C"], ["cpp", "C++"], ["java", "Java"]]],
  ["level", "Level", [["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]]],
  ["count", "Questions", [["5", "5"], ["10", "10"], ["15", "15"], ["20", "20"], ["e", "Endless"], ["c", "Custom"]]],
  ["pace", "Time per door", [["0", "Practice (no timer)"], ["40", "Relaxed (40s)"], ["25", "Normal (25s)"], ["15", "Pressure (15s)"], ["c", "Custom"]]],
  ["snd", "Sound", [["temple", "Temple"], ["chimes", "Chimes"], ["arcade", "Arcade"], ["zen", "Zen"], ["off", "Off"]]]
];
const SL = { count: ["cn", 3, 25, " questions"], pace: ["cp", 5, 90, " seconds"] };
const cfg = { wing: "riddles", lang: "python", level: "easy", count: "10", pace: "25", cn: "8", cp: "20", snd: "temple" };
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/\s+/g, "").replace(/'/g, '"');
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));

function rngOf(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genRiddle(r, level) {
  if (r() < 0.5) {
    const t = []; let e;
    if (level === "easy") {
      const a = ri(r, 1, 9), d = ri(r, 2, 9);
      for (let i = 0; i < 6; i++) t.push(a + d * i);
      e = "Each number adds " + d + ".";
    } else if (level === "medium") {
      const a = ri(r, 1, 3), g = ri(r, 2, 3);
      for (let i = 0; i < 6; i++) t.push(a * g ** i);
      e = "Each number is multiplied by " + g + ".";
    } else {
      let x = ri(r, 1, 5), g = ri(r, 2, 4);
      const s = ri(r, 1, 3), g0 = g;
      for (let i = 0; i < 6; i++) { t.push(x); x += g; g += s; }
      e = "The gaps start at " + g0 + " and grow by " + s + " each time.";
    }
    const ans = t.pop();
    return { q: "Find the next number: " + t.join(", ") + ", ?", c: "", a: [String(ans)], h: "Look at how each number changes.", e };
  }
  const w = WORDS[ri(r, 0, WORDS.length - 1)];
  const k = level === "easy" ? ri(r, 1, 2) : level === "medium" ? ri(r, 3, 5) : ri(r, 6, 9);
  const enc = [...w].map(c => String.fromCharCode((c.charCodeAt(0) - 97 + k) % 26 + 97)).join("");
  return { q: "Decode this word, each letter moved " + k + " steps forward: " + enc.toUpperCase(), c: "", a: [w], h: "Count each letter " + k + " steps backwards.", e: "Moving every letter " + k + " steps back gives the word." };
}
function genCode(r, level, L) {
  let code, ans, e;
  if (level === "easy") {
    const a = ri(r, 2, 9), b = ri(r, 2, 9), c = ri(r, 2, 9);
    code = PR[L](a + " + " + b + " * " + c);
    ans = a + b * c;
    e = "Multiplication comes first: " + b + " * " + c + " = " + b * c + ", then add " + a + ".";
  } else {
    const hard = level === "hard", N = ri(r, 3, hard ? 6 : 9), body = hard ? "i * i" : "i";
    let s = 0;
    for (let i = 1; i <= N; i++) s += hard ? i * i : i;
    const head = L === "python"
      ? "s = 0\nfor i in range(1, " + (N + 1) + "):\n    s += " + body + "\n"
      : "int s = 0;\nfor (int i = 1; i <= " + N + "; i++)\n    s += " + body + ";\n";
    code = head + PR[L]("s");
    ans = s;
    e = "The loop adds " + body + " for i = 1 to " + N + ", so s ends as " + s + ".";
  }
  return { q: "What does this code print?", c: code, a: [String(ans)], h: HINT[level], e };
}
function parse(s) {
  const p = s.split("###");
  if (run.wing === "riddles") return { q: p[0], c: "", a: p[1].split(","), h: p[2], e: p[3] || p[2] };
  return { q: run.level === "medium" ? "Spot the bug. Type the fixed line:" : "What does this code print?", c: p[0], a: [p[1]], h: HINT[run.level], e: HINT[run.level] };
}
function makeQueue(r) {
  const raw = run.wing === "riddles" ? BANK.riddles[run.level] : BANK.runes[run.lang][run.level];
  const pool = [...raw].sort(() => r() - 0.5);
  return () => {
    if (pool.length && r() < 0.5) return parse(pool.pop());
    return run.wing === "riddles" ? genRiddle(r, run.level) : genCode(r, run.level, run.lang);
  };
}

let run, nextItem, item, idx, lives, score, streak, solved, left, timer, phase, maxS = 0;
function mk(daily) {
  const d = new Date().toISOString().slice(0, 10);
  const pace = cfg.pace === "c" ? +cfg.cp : +cfg.pace;
  let count = cfg.count === "e" ? Infinity : cfg.count === "c" ? +cfg.cn : +cfg.count;
  if (pace === 0 && count === Infinity) count = 20;
  const o = daily
    ? { wing: cfg.wing, lang: cfg.lang, level: "medium", count: 5, pace: 25, daily: true, seed: "d" + d + cfg.wing + cfg.lang }
    : { wing: cfg.wing, lang: cfg.lang, level: cfg.level, count, pace, daily: false, seed: String(Math.random()) };
  o.key = daily ? ["daily", d, o.wing, o.lang].join("-") : [o.wing, o.wing === "runes" ? o.lang : "-", o.level, cfg.count === "c" ? "c" + count : count, o.pace].join("-");
  return o;
}
function best(k) { try { return +localStorage.getItem("temple_best_" + k) || 0; } catch (e) { return 0; } }
function saveBest(k, v) { try { localStorage.setItem("temple_best_" + k, v); } catch (e) {} }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("hidden", s.id !== id)); }

function refresh() {
  GROUPS.forEach(([k]) => document.querySelectorAll("#g-" + k + " .chip").forEach(b => b.classList.toggle("on", b.dataset.v === cfg[k])));
  $("g-lang").classList.toggle("hidden", cfg.wing !== "runes");
  $("s-count").classList.toggle("hidden", cfg.count !== "c");
  $("s-pace").classList.toggle("hidden", cfg.pace !== "c");
  document.body.dataset.wing = cfg.wing;
  $("mute").textContent = cfg.snd === "off" ? "Sound off" : "Sound on";
  const b = best(mk(false).key);
  $("best").textContent = b ? "Your best score with these settings: " + b : "No score yet with these settings.";
}
function buildSetup() {
  GROUPS.forEach(([k, label, opts]) => {
    const g = document.createElement("div");
    g.className = "grp"; g.id = "g-" + k;
    const sp = document.createElement("span");
    sp.textContent = label;
    g.appendChild(sp);
    opts.forEach(([v, t]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = t; b.dataset.v = v;
      b.onclick = () => { cfg[k] = v; refresh(); if (k === "snd") SFX.ok(); };
      g.appendChild(b);
    });
    if (SL[k]) {
      const [ck, mn, mx, u] = SL[k];
      const w = document.createElement("div");
      w.className = "sl hidden"; w.id = "s-" + k;
      const i = document.createElement("input");
      i.type = "range"; i.min = mn; i.max = mx; i.value = cfg[ck];
      i.setAttribute("aria-label", label + ", custom value");
      const o = document.createElement("output");
      o.textContent = cfg[ck] + u;
      i.oninput = () => { cfg[ck] = i.value; o.textContent = i.value + u; refresh(); };
      w.append(i, o);
      g.appendChild(w);
    }
    $("setup").appendChild(g);
  });
  refresh();
}

function start(daily) {
  run = mk(daily);
  nextItem = makeQueue(rngOf(run.seed));
  idx = 0; lives = 3; score = 0; streak = 0; solved = 0; maxS = 0;
  $("wn").textContent = (run.wing === "runes" ? NAMES[run.lang] : "Riddles") + ", " + run.level + (run.daily ? ", daily" : "");
  $("hint").textContent = run.pace > 0 ? "Hint (-5s)" : "Hint";
  $("skip").textContent = run.pace > 0 ? "Skip (-1 life)" : "Skip";
  show("game");
  load();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
}
function hud() {
  $("lives").textContent = run.pace > 0 ? "\u2665".repeat(lives) + "\u2661".repeat(3 - lives) : "Practice mode";
  $("score").textContent = "Score " + score + (streak > 1 ? "   Streak " + streak : "");
  $("time").textContent = run.pace > 0 ? fmt(Math.max(left, 0)) + " / " + fmt(run.pace) : "No timer";
  $("time").className = run.pace > 0 && left <= 5 ? "low" : "";
  $("tfill").style.width = run.pace > 0 ? Math.max(left, 0) / run.pace * 100 + "%" : "100%";
  $("tfill").className = run.pace > 0 && left <= 5 ? "low" : "";
  $("tfill").parentNode.classList.toggle("off", run.pace === 0);
}
function load() {
  item = nextItem();
  phase = "ask";
  left = run.pace;
  $("door").classList.remove("open");
  $("rn").textContent = (idx + 1) + (isFinite(run.count) ? " of " + run.count : "");
  $("q").textContent = item.q;
  $("code").textContent = item.c;
  $("code").style.display = item.c ? "block" : "none";
  $("ans").value = "";
  $("msg").textContent = "";
  $("go").textContent = "Open door";
  $("hint").disabled = $("skip").disabled = false;
  hud();
  $("ans").focus();
}
function tick() {
  if (phase !== "ask" || run.pace === 0) return;
  left--;
  hud();
  if (left > 0 && left <= 5) SFX.tick();
  if (left <= 0) fail("Time is up. ");
}
function review(ok, pre) {
  phase = "review";
  if (ok) { $("door").classList.add("open"); SFX.ok(); pop(); }
  const last = lives <= 0 || idx + 1 >= run.count;
  $("msg").textContent = pre + "Answer: " + item.a[0] + ". " + item.e;
  $("go").textContent = last ? "Finish" : "Next door";
  $("hint").disabled = $("skip").disabled = true;
  $("ans").value = "";
  hud();
}
function fail(pre) {
  if (phase !== "ask") return;
  streak = 0;
  SFX.bad();
  if (run.pace > 0) lives--;
  review(false, pre);
}
function submit() {
  if (phase === "review") return next();
  if (item.a.map(norm).includes(norm($("ans").value))) {
    streak++; solved++; maxS = Math.max(maxS, streak);
    score += 10 + left + (streak > 1 ? streak * 2 : 0);
    review(true, "The stone door grinds open. ");
  } else {
    streak = 0;
    const c = $("card");
    c.classList.remove("shake", "flash");
    void c.offsetWidth;
    c.classList.add("shake", "flash");
    $("msg").textContent = "The door stays shut. Check your answer and try again.";
    SFX.bad();
    hud();
  }
}
function hint() {
  if (phase !== "ask") return;
  if (run.pace > 0) left = Math.max(1, left - 5);
  $("msg").textContent = "Hint: " + item.h;
  hud();
}
function next() {
  if (lives <= 0) return finish(false);
  idx++;
  if (idx >= run.count) return finish(true);
  load();
}
function finish(win) {
  clearInterval(timer);
  show("end");
  const timed = run.pace > 0, prev = best(run.key), rec = timed && score > prev;
  if (rec) saveBest(run.key, score);
  $("et").textContent = win ? "You escaped" : isFinite(run.count) ? "The torches died" : "Run over";
  $("stars").textContent = win && timed ? "\u2605".repeat(lives) + "\u2606".repeat(3 - lives) : "";
  const att = win ? idx : idx + 1, acc = att ? Math.round(solved / att * 100) : 0;
  const rk = win && acc >= 90 ? "Temple Master" : win ? "Relic Hunter" : solved >= 3 ? "Tomb Wanderer" : "Lost Explorer";
  $("rank").textContent = rk;
  $("stats").innerHTML = "<div><b>" + score + "</b>Score</div><div><b>" + acc + "%</b>Accuracy</div><div><b>" + maxS + "</b>Best streak</div>";
  shareText = "Temple Escape: " + rk + "! Score " + score + ", " + solved + " doors solved, " + acc + "% accuracy, best streak " + maxS + ". Can you beat it?";
  $("copy").textContent = "Copy result";
  if (win) { SFX.win(); sparks(); } else SFX.lose();
  $("es").textContent = "Score: " + score + ". Doors solved: " + solved + (isFinite(run.count) ? " of " + run.count : "") + ". "
    + (timed ? (rec ? "New best score!" : "Best score: " + prev + ".") : "Practice mode, scores are not saved.")
    + (run.daily ? " Come back tomorrow for a new daily challenge." : "");
}

for (let i = 0; i < 16; i++) {
  const e = document.createElement("i");
  e.style.left = Math.random() * 100 + "%";
  e.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
  e.style.animationDuration = 6 + Math.random() * 8 + "s";
  e.style.animationDelay = Math.random() * 8 + "s";
  $("embers").appendChild(e);
}
$("mute").onclick = () => { if (cfg.snd === "off") cfg.snd = lastSnd; else { lastSnd = cfg.snd; cfg.snd = "off"; } refresh(); };
$("copy").onclick = () => {
  const ok = () => { $("copy").textContent = "Copied!"; }, no = () => { $("copy").textContent = "Copy not available"; };
  try { navigator.clipboard.writeText(shareText).then(ok, no); } catch (e) { no(); }
};
$("start").onclick = () => start(false);
$("daily").onclick = () => start(true);
$("go").onclick = submit;
$("hint").onclick = hint;
$("skip").onclick = () => fail("Skipped. ");
$("again").onclick = () => start(run.daily);
$("home-btn").onclick = () => { refresh(); show("home"); };
$("ans").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
buildSetup();
</script>
</body>
</html>
